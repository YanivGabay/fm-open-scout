[package]
name = "fm_save_parser"
version = "0.2.0"
edition = "2021"
description = "Football Manager (.fm) save file parser with per-version layout dispatch (part of fm-open-scout)"
license = "MIT"
authors = ["Yaniv Gabay"]

[lib]
name = "fm_save_parser"
path = "src/lib.rs"

[[bin]]
name = "fm_save_parser"
path = "src/main.rs"

[dependencies]
zstd = "0.13"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true

[profile.test]
opt-level = 3
