name: Release

# Push a tag like v0.2.0 to build the parser for every platform and publish a
# GitHub release with the binaries. Run it by hand to build without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: '' }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} --manifest-path fm_save_parser/Cargo.toml
      - name: Rename binary
        shell: bash
        run: |
          mkdir dist
          cp fm_save_parser/target/${{ matrix.target }}/release/fm_save_parser${{ matrix.ext }} dist/fm_save_parser-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v7
        with:
          name: fm_save_parser-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
